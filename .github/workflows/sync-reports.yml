name: Sync reports to main

# 排程把日報推到 claude/* 分支時，把「main 還沒有的」reports/*.html 同步進 main（只新增，不覆蓋）。
on:
  push:
    branches: ['claude/**']
    paths: ['reports/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-reports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch source branch
        run: git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
      - name: Sync new reports into main
        run: scripts/sync_reports.sh "${GITHUB_REF_NAME}"
      - name: Push main
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
